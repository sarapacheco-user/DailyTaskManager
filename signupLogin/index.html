<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="userPage" class="userPage">
    <main>
        <section id="container" class="container">
            <section id="signUp" class="signUp">
                <h1 class="title2">Sign Up</h1>
                <form id="signupForm">
                    <input type="text" name="name" placeholder="First name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
            </section>

            <section id="login" class="login">
                <h1 class="title2">Login</h1>
                <form id="loginForm">
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <p class="forgotPassword" id="forgotPassword">Forgot your password?</p>
                    <button type="submit">Login</button>
                </form>
            </section>
        </section>
    </main>
<!-- Password Reset Popup -->
<div id="resetPopup" class="popup">
    <div class="popup-content">
        <h2>Reset Password</h2>
        <input type="email" id="resetEmail" placeholder="Enter your email" required>
        <button id="sendReset">Send Reset Link</button>
        <button id="closePopup">Cancel</button>
    </div>
    <div id="resetPasswordPage" class="popup">
        <div class="popup-content">
            <h2>Enter New Password</h2>
            <input type="password" id="newPassword" placeholder="New Password" required>
            <button id="resetPasswordButton">Reset Password</button>
        </div>
    </div>
</div>
    <footer>
        <p>&copy; 2025 DailyTask Project by Sara Pacheco</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
